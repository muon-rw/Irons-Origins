pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Muon'
            url = 'https://maven.muon.rip/releases'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Irons-Origins'
